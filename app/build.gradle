apply plugin: 'com.android.application'

android {
    namespace "com.google.android.youtube.pro"  
    compileSdk 36

    defaultConfig {
        applicationId "com.google.android.youtube.pro"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "3.98"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because 'kotlin-stdlib-jdk7 and kotlin-stdlib-jdk8 are merged into kotlin-stdlib from 1.8.0'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.21') {
            because 'kotlin-stdlib-jdk7 is merged into kotlin-stdlib from 1.8.0'
            because 'kotlin-stdlib-jdk7 is merged into kotlin-stdlib from 1.8.0'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.21') {
            because 'kotlin-stdlib-jdk8 is merged into kotlin-stdlib from 1.8.0'
        }
    }
}



